<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="720" viewBox="0 0 1300 720">
<rect width="1300" height="720" fill="#0b1220"/>
<text x="50" y="55" fill="#fff" font-size="32" font-family="Arial" font-weight="700">Dynamic Formation → 11-Gene Chromosome</text>
<text x="50" y="95" fill="#9fb3c8" font-size="19" font-family="Arial">Example: 4-2-3-1. Goalkeeper is implicit; formation describes 10 outfield players.</text>
<rect x="60" y="145" width="210" height="90" rx="16" fill="#17253e" stroke="#69b8ff" stroke-width="2"/>
<text x="165" y="182" fill="#fff" font-size="23" text-anchor="middle" font-family="Arial">4-2-3-1</text>
<text x="165" y="213" fill="#b9d8f5" font-size="17" text-anchor="middle" font-family="Arial">sum = 10 outfield</text>
<line x1="270" y1="190" x2="360" y2="190" stroke="#7890a8" stroke-width="3"/><polygon points="360,190 346,182 346,198" fill="#7890a8"/>
<rect x="360" y="120" width="380" height="145" rx="18" fill="#17253e" stroke="#7bd389" stroke-width="2"/>
<text x="550" y="155" fill="#fff" font-size="22" text-anchor="middle" font-family="Arial">Generated tactical slots</text>
<text x="550" y="190" fill="#d5f2da" font-size="18" text-anchor="middle" font-family="Arial">GK</text>
<text x="550" y="220" fill="#d5f2da" font-size="18" text-anchor="middle" font-family="Arial">DEF×4 · MID1×2 · MID2×3 · ATT×1</text>
<line x1="740" y1="190" x2="825" y2="190" stroke="#7890a8" stroke-width="3"/><polygon points="825,190 811,182 811,198" fill="#7890a8"/>
<rect x="825" y="120" width="415" height="145" rx="18" fill="#17253e" stroke="#ffd166" stroke-width="2"/>
<text x="1032" y="155" fill="#fff" font-size="22" text-anchor="middle" font-family="Arial">Chromosome</text>
<text x="1032" y="192" fill="#ffe9ac" font-size="17" text-anchor="middle" font-family="Arial">[GK, D1, D2, D3, D4, M1, M2, M3, M4, M5, A1]</text>
<text x="1032" y="226" fill="#ffe9ac" font-size="17" text-anchor="middle" font-family="Arial">Each gene stores one unique player_id</text>

<text x="60" y="335" fill="#fff" font-size="24" font-family="Arial" font-weight="700">Hard constraints</text>
<g font-family="Arial" font-size="18">
<rect x="60" y="370" width="250" height="95" rx="14" fill="#143322" stroke="#49b76a"/><text x="185" y="405" fill="#fff" text-anchor="middle">Exactly 11 players</text><text x="185" y="435" fill="#ccefd6" text-anchor="middle">no duplicates</text>
<rect x="340" y="370" width="250" height="95" rx="14" fill="#143322" stroke="#49b76a"/><text x="465" y="405" fill="#fff" text-anchor="middle">Exactly 1 GK</text><text x="465" y="435" fill="#ccefd6" text-anchor="middle">GK only in slot 0</text>
<rect x="620" y="370" width="250" height="95" rx="14" fill="#143322" stroke="#49b76a"/><text x="745" y="405" fill="#fff" text-anchor="middle">Selected players only</text><text x="745" y="435" fill="#ccefd6" text-anchor="middle">same team + active</text>
<rect x="900" y="370" width="290" height="95" rx="14" fill="#143322" stroke="#49b76a"/><text x="1045" y="405" fill="#fff" text-anchor="middle">Skill-based assignment</text><text x="1045" y="435" fill="#ccefd6" text-anchor="middle">not forced by stored position</text>
</g>

<rect x="135" y="545" width="1030" height="105" rx="18" fill="#111a2b" stroke="#5b6b83"/>
<text x="650" y="582" fill="#fff" font-size="21" text-anchor="middle" font-family="Arial">If 11 players are selected → optimize assignment.</text>
<text x="650" y="617" fill="#fff" font-size="21" text-anchor="middle" font-family="Arial">If more than 11 are selected → optimize both Starting XI selection and assignment.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="760" viewBox="0 0 1250 760">
<rect width="1250" height="760" fill="#f7f9fc"/>
<text x="50" y="55" fill="#172033" font-size="31" font-family="Arial" font-weight="700">Genetic Algorithm Evolution Cycle in Tactiki</text>
<g font-family="Arial" text-anchor="middle">
<rect x="70" y="125" width="250" height="105" rx="18" fill="#e6f2ff" stroke="#4c8bc7" stroke-width="2"/>
<text x="195" y="164" fill="#172033" font-size="21">Initial population</text><text x="195" y="196" fill="#42536b" font-size="17">100 valid chromosomes</text>

<rect x="500" y="110" width="250" height="135" rx="18" fill="#fff3d8" stroke="#d69d38" stroke-width="2"/>
<text x="625" y="150" fill="#172033" font-size="21">Fitness evaluation</text><text x="625" y="183" fill="#42536b" font-size="17">Synergy Score 0–100</text><text x="625" y="215" fill="#42536b" font-size="17">higher = better lineup</text>

<rect x="930" y="125" width="250" height="105" rx="18" fill="#efe7ff" stroke="#7757c7" stroke-width="2"/>
<text x="1055" y="164" fill="#172033" font-size="21">Tournament selection</text><text x="1055" y="196" fill="#42536b" font-size="17">tournament size = 3</text>

<rect x="885" y="380" width="280" height="125" rx="18" fill="#e9f7ed" stroke="#4ba368" stroke-width="2"/>
<text x="1025" y="420" fill="#172033" font-size="21">Uniform crossover</text><text x="1025" y="452" fill="#42536b" font-size="17">crossover p = 0.8</text><text x="1025" y="482" fill="#42536b" font-size="17">then deterministic repair</text>

<rect x="485" y="385" width="280" height="115" rx="18" fill="#fff0ef" stroke="#c45a53" stroke-width="2"/>
<text x="625" y="424" fill="#172033" font-size="21">Slot-aware mutation</text><text x="625" y="456" fill="#42536b" font-size="17">mutation p = 0.2</text><text x="625" y="485" fill="#42536b" font-size="17">constraints remain valid</text>

<rect x="70" y="385" width="270" height="115" rx="18" fill="#eef2f6" stroke="#758295" stroke-width="2"/>
<text x="205" y="424" fill="#172033" font-size="21">Elitism</text><text x="205" y="456" fill="#42536b" font-size="17">best 2 survive unchanged</text><text x="205" y="485" fill="#42536b" font-size="17">protects strongest solutions</text>
</g>

<g stroke="#607086" stroke-width="3" fill="none">
<line x1="320" y1="177" x2="500" y2="177"/><polygon points="500,177 486,169 486,185" fill="#607086"/>
<line x1="750" y1="177" x2="930" y2="177"/><polygon points="930,177 916,169 916,185" fill="#607086"/>
<line x1="1055" y1="230" x2="1055" y2="380"/><polygon points="1055,380 1047,366 1063,366" fill="#607086"/>
<line x1="885" y1="442" x2="765" y2="442"/><polygon points="765,442 779,434 779,450" fill="#607086"/>
<line x1="485" y1="442" x2="340" y2="442"/><polygon points="340,442 354,434 354,450" fill="#607086"/>
<path d="M205 385 C205 300, 350 295, 480 245" stroke="#607086"/><polygon points="480,245 464,242 470,257" fill="#607086"/>
</g>

<rect x="230" y="590" width="790" height="105" rx="18" fill="#ffffff" stroke="#9aa8b8" stroke-width="2"/>
<text x="625" y="628" fill="#172033" font-size="21" text-anchor="middle" font-family="Arial">Repeat for 100 generations with deterministic seed 42.</text>
<text x="625" y="662" fill="#172033" font-size="21" text-anchor="middle" font-family="Arial">Return the highest-fitness valid lineup and save it atomically.</text>
</svg>
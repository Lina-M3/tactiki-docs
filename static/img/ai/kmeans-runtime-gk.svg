<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="760" viewBox="0 0 1250 760">
  <rect width="1250" height="760" fill="#f8fafc"/>
  <text x="55" y="55" fill="#172033" font-size="31" font-family="Arial" font-weight="700">Runtime Position Analysis — fixed FIFA reference, roster-independent</text>
  <rect x="455" y="95" width="340" height="95" rx="18" fill="#e9f3ff" stroke="#4c8bc7" stroke-width="2"/>
  <text x="625" y="133" fill="#172033" font-size="21" font-family="Arial" text-anchor="middle">University player</text>
  <text x="625" y="166" fill="#172033" font-size="18" font-family="Arial" text-anchor="middle">position + six-skill profile</text>
  <line x1="625" y1="190" x2="625" y2="245" stroke="#5d6d7e" stroke-width="3"/>
  <polygon points="625,245 617,232 633,232" fill="#5d6d7e"/>
  <polygon points="625,245 617,232 633,232" fill="#5d6d7e"/>
  <rect x="475" y="245" width="300" height="85" rx="16" fill="#ffffff" stroke="#8c99aa" stroke-width="2"/>
  <text x="625" y="278" fill="#172033" font-size="20" font-family="Arial" text-anchor="middle">Is position GK / Goalkeeper?</text>
  <text x="625" y="307" fill="#56657a" font-size="16" font-family="Arial" text-anchor="middle">case-insensitive, trimmed</text>
  <line x1="475" y1="287" x2="250" y2="287" stroke="#5d6d7e" stroke-width="3"/>
  <polygon points="250,287 263,279 263,295" fill="#5d6d7e"/>
  <text x="357" y="270" fill="#2d7b45" font-size="18" font-family="Arial">YES</text>
  <rect x="70" y="235" width="180" height="110" rx="16" fill="#e9f8ed" stroke="#45a25e" stroke-width="2"/>
  <text x="160" y="273" fill="#172033" font-size="20" font-family="Arial" text-anchor="middle">Goalkeeper</text>
  <text x="160" y="305" fill="#172033" font-size="17" font-family="Arial" text-anchor="middle">cluster_id = null</text>
  <text x="160" y="330" fill="#172033" font-size="16" font-family="Arial" text-anchor="middle">no K-Means comparison</text>
  <line x1="775" y1="287" x2="980" y2="287" stroke="#5d6d7e" stroke-width="3"/>
  <polygon points="980,287 967,279 967,295" fill="#5d6d7e"/>
  <text x="873" y="270" fill="#a06419" font-size="18" font-family="Arial">NO</text>
  <rect x="980" y="225" width="220" height="125" rx="16" fill="#fff5dd" stroke="#d79b37" stroke-width="2"/>
  <text x="1090" y="260" fill="#172033" font-size="19" font-family="Arial" text-anchor="middle">Validate 6 skills</text>
  <text x="1090" y="290" fill="#172033" font-size="16" font-family="Arial" text-anchor="middle">complete + finite</text>
  <text x="1090" y="320" fill="#172033" font-size="16" font-family="Arial" text-anchor="middle">build canonical vector</text>
  <line x1="1090" y1="350" x2="1090" y2="420" stroke="#5d6d7e" stroke-width="3"/>
  <polygon points="1090,420 1082,407 1098,407" fill="#5d6d7e"/>
  <rect x="870" y="420" width="330" height="135" rx="18" fill="#eee9ff" stroke="#7654c7" stroke-width="2"/>
  <text x="1035" y="456" fill="#172033" font-size="19" font-family="Arial" text-anchor="middle">Compare to fixed FIFA centroids</text>
  <text x="1035" y="488" fill="#172033" font-size="17" font-family="Arial" text-anchor="middle">Euclidean distance → nearest center</text>
  <text x="1035" y="520" fill="#172033" font-size="16" font-family="Arial" text-anchor="middle">0 Defender · 1 Attacker · 2 Midfielder</text>
  <rect x="255" y="475" width="460" height="155" rx="18" fill="#ffffff" stroke="#8c99aa" stroke-width="2"/>
  <text x="485" y="510" fill="#172033" font-size="20" font-family="Arial" text-anchor="middle" font-weight="700">Why roster-independent?</text>
  <text x="485" y="545" fill="#172033" font-size="17" font-family="Arial" text-anchor="middle">The centroids came from FIFA 23 and never move at runtime.</text>
  <text x="485" y="578" fill="#172033" font-size="17" font-family="Arial" text-anchor="middle">The same six-skill vector maps to the same nearest centroid</text>
  <text x="485" y="608" fill="#172033" font-size="17" font-family="Arial" text-anchor="middle">even if the player's teammates change.</text>
  <text x="625" y="704" fill="#56657a" font-size="18" font-family="Arial" text-anchor="middle">Runtime analysis is read-only: it does not overwrite Player.position or any database record.</text>
</svg>